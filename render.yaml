# Render Blueprint — Project Camp
#
# One web service, one origin: Render builds the React client (client/) and
# Express serves client/dist alongside the API. See the step-by-step guide in
# projectmanagementbackend/docs/08-deploy-render.md.
#
# Deploy: Render Dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: project-camp
    runtime: node
    rootDir: projectmanagementbackend
    plan: free # 0.1 CPU / 512 MB; swap for 0.5c-512mb or larger in prod
    # NODE_ENV=production (below) applies at build time too, which makes npm ci
    # skip devDependencies — --include=dev is required or vite won't install.
    buildCommand: npm ci && cd client && npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/healthcheck
    autoDeployTrigger: commit
    envVars:
      # Match local dev (backend package.json has no engines field).
      - key: NODE_VERSION
        value: "24.18.0"
      # Enables secure cookies + strips the dev-only OTP from API responses.
      - key: NODE_ENV
        value: production
      # Render's edge proxy sets X-Forwarded-For; 1 trusted hop keeps the
      # auth rate-limiter keying on the real client IP (see .ENV.SAMPLE).
      - key: TRUST_PROXY
        value: "1"
      # ── Set these in the dashboard after the first deploy ─────────────
      # Paste your MongoDB Atlas connection string (Atlas Network Access
      # must allow 0.0.0.0/0 — Render IPs are dynamic).
      - key: MONGO_URI
        sync: false
      # Defensive same-origin allow-list (auth is same-origin, no CORS needed).
      # Must be the service URL, e.g. https://project-camp.onrender.com
      - key: CORS_ORIGIN
        sync: false
      # ── Generated by Render (secret, shown once) ──────────────────────
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # Auth has NO e-mail step: register creates the account and logs the
      # user in immediately (no OTP, no SMTP vars anywhere).
      # These have code fallbacks ('1d' / '7d') but are pinned here so the
      # deployed behaviour is explicit.
      - key: ACCESS_TOKEN_EXPIRY
        value: "1d"
      - key: REFRESH_TOKEN_EXPIRY
        value: "7d"
      # Optional overrides (code defaults apply if unset):
      # - key: BCRYPT_SALT_ROUNDS   value: "10"
      # - key: ADMIN_USERNAME       sync: false   (bootstrap admin, default admin)
      # - key: ADMIN_EMAIL          sync: false   (default admin@example.com)
      # - key: ADMIN_PASSWORD       sync: false   (default admin123 — change it!)
