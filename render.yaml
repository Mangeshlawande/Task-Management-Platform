# Render Blueprint — Project Camp
#
# One web service, one origin: Render builds the React client (client/) and
# Express serves client/dist alongside the API. See the step-by-step guide in
# projectmanagementbackend/docs/08-deploy-render.md.
#
# Deploy: Render Dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: project-camp
    runtime: node
    rootDir: projectmanagementbackend
    plan: free # 0.1 CPU / 512 MB; swap for 0.5c-512mb or larger in prod
    buildCommand: npm ci && cd client && npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/healthcheck
    autoDeployTrigger: commit
    envVars:
      # Match local dev (backend package.json has no engines field).
      - key: NODE_VERSION
        value: "24.18.0"
      # Enables secure cookies + strips the dev-only OTP from API responses.
      - key: NODE_ENV
        value: production
      # Render's edge proxy sets X-Forwarded-For; 1 trusted hop keeps the
      # auth rate-limiter keying on the real client IP (see .ENV.SAMPLE).
      - key: TRUST_PROXY
        value: "1"
      # ── Set these in the dashboard after the first deploy ─────────────
      # Paste your MongoDB Atlas connection string (Atlas Network Access
      # must allow 0.0.0.0/0 — Render IPs are dynamic).
      - key: MONGO_URI
        sync: false
      # Both must be the service URL, e.g. https://project-camp.onrender.com
      # (email verification/reset links + CORS allow-list).
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Required for real signups: NODE_ENV=production removes the dev OTP
      # from API responses, so OTP emails must actually send.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: "Project Camp <noreply@projectcamp.dev>"
      # ── Generated by Render (secret, shown once) ──────────────────────
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # Optional overrides (defaults from .ENV.SAMPLE apply if unset):
      # - key: BCRYPT_SALT_ROUNDS   value: "10"
      # - key: ADMIN_EMAIL          sync: false   (bootstrap admin login)
